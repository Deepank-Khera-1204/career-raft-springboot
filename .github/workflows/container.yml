name: Career Raft Runtime Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pom.xml
      - src/**
      - config/**
      - data/profile.yaml
      - data/experience.yaml
      - data/projects.yaml
      - data/skills.yaml
      - data/education.yaml
      - data/certifications.yaml
      - data/sources.yaml
      - resume/**
      - cover_letter/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: career-raft-runtime-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/deepank-khera-1204/career-raft-java

jobs:
  build-and-push:
    name: Build runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build application jar
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=career-raft-runtime
          cache-to: type=gha,mode=max,scope=career-raft-runtime
