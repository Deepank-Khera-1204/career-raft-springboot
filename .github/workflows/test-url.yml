name: Career Raft URL Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Single job URL to parse and score"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: career-raft-url-test
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/deepank-khera-1204/career-raft-java:main

jobs:
  test-url:
    name: Test single job URL
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime image
        run: docker pull "${IMAGE_NAME}"

      - name: Test URL
        env:
          CAREER_RAFT_TEST_URL: ${{ inputs.url }}
        run: |
          docker run --rm --init             -e CAREER_RAFT_TEST_URL             "${IMAGE_NAME}"
