name: Career Raft URL Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Single job URL to parse and score"
        required: true
        type: string
      gemini:
        description: "Run Gemini semantic analysis"
        required: true
        default: false
        type: boolean
      linkedin:
        description: "Run Brave-powered LinkedIn referral search"
        required: true
        default: false
        type: boolean
      email:
        description: "Send a qualifying application package to CR_EMAIL_TO"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: career-raft-url-test
  cancel-in-progress: true

jobs:
  test-url:
    name: Test single job URL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build branch
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Install LaTeX/PDF tools for email package
        if: ${{ inputs.email }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils

      - name: Test URL
        env:
          CAREER_RAFT_TEST_URL: ${{ inputs.url }}
          CAREER_RAFT_TEST_GEMINI: ${{ inputs.gemini }}
          CAREER_RAFT_TEST_LINKEDIN: ${{ inputs.linkedin }}
          CAREER_RAFT_TEST_EMAIL: ${{ inputs.email }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          CR_EMAIL_TO: ${{ secrets.CR_EMAIL_TO }}
          CR_EMAIL_FROM: ${{ secrets.CR_EMAIL_FROM }}
          CR_SMTP_HOST: ${{ secrets.CR_SMTP_HOST }}
          CR_SMTP_PORT: ${{ secrets.CR_SMTP_PORT }}
          CR_SMTP_USERNAME: ${{ secrets.CR_SMTP_USERNAME }}
          CR_SMTP_PASSWORD: ${{ secrets.CR_SMTP_PASSWORD }}
          CR_SMTP_USE_TLS: ${{ secrets.CR_SMTP_USE_TLS }}
        run: java -jar target/career-raft-java-0.1.0-SNAPSHOT.jar
