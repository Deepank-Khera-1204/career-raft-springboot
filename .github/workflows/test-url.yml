name: Career Raft URL Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Single job URL to test"
        required: true
        type: string
      gemini:
        description: "Run Gemini semantic analysis"
        required: true
        default: false
        type: boolean
      linkedin:
        description: "Run Brave-powered LinkedIn referral search"
        required: true
        default: false
        type: boolean
      email:
        description: "Send a qualifying application package to CR_EMAIL_TO"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  dispatch-test-branch:
    name: Run test/url branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Dispatch branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.url }}
          GEMINI: ${{ inputs.gemini }}
          LINKEDIN: ${{ inputs.linkedin }}
          EMAIL: ${{ inputs.email }}
        run: |
          gh workflow run test-url.yml \
            --repo "${{ github.repository }}" \
            --ref test/url \
            -f "url=${URL}" \
            -f "gemini=${GEMINI}" \
            -f "linkedin=${LINKEDIN}" \
            -f "email=${EMAIL}"

      - name: Confirm dispatch
        run: echo "Dispatched test/url URL test workflow."
