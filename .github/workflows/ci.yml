name: Career Raft CI

on:
  push:
    branches: [main]
    paths-ignore:
      - data/career_raft.sqlite
      - data/applications/**
      - data/semantic-analysis/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-raft-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
